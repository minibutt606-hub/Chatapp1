name: chatapp
description: "A Flutter chat application."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  cupertino_icons: ^1.0.9
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  firebase_core: ^4.7.0
  google_fonts: ^8.0.2
  get: ^4.7.3
  image_picker: ^1.2.1
  image_cropper: ^12.2.1
  uuid: ^4.5.3 
  permission_handler: ^12.0.1
  record: ^6.2.0
  audioplayers: ^6.6.0 
  emoji_picker_flutter: ^4.4.0
  file_picker: 10.3.8
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  cloudinary_public: ^0.23.1
  video_player: ^2.11.1
  chewie: ^1.13.1
  zego_uikit: ^2.28.45
  zego_uikit_prebuilt_call: ^4.22.5
  zego_uikit_signaling_plugin: ^2.8.20
  zego_zim: 2.27.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0
  http: ^1.6.0
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5


dependency_overrides:
  record_linux: ^1.3.0
  record_platform_interface: ^1.5.0
  zego_zim: 2.27.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter


flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon.png"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21 
  remove_alpha_ios: true
  

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
